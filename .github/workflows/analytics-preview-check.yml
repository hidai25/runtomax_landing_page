name: Analytics preview checks
on:
  push:
    branches: [codex/website-analytics-consent]
  pull_request:
    paths:
      - 'app/_components/AnalyticsConsent.tsx'
      - 'app/(en)/layout.tsx'
      - 'app/(fr)/layout.tsx'
      - 'app/(en)/privacy/page.tsx'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
